<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мини-CRM — Канбан сделок</title>
<style>
  :root {
    --bg: #f3f5f9;
    --surface: #ffffff;
    --surface-2: #eaeef5;
    --text: #1c2333;
    --muted: #6b7690;
    --border: #d9dfeb;
    --primary: #3b6cf6;
    --primary-text: #ffffff;
    --danger: #e5484d;
    --shadow: 0 1px 2px rgba(20, 30, 60, .08), 0 2px 8px rgba(20, 30, 60, .06);
    --shadow-drag: 0 10px 28px rgba(20, 30, 60, .25);
    --drop: rgba(59, 108, 246, .10);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0f131c;
    --surface: #1a2030;
    --surface-2: #151a27;
    --text: #e6eaf5;
    --muted: #8f9bb6;
    --border: #2a3248;
    --primary: #5b8cff;
    --primary-text: #0b1020;
    --danger: #ff6b70;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 2px 8px rgba(0, 0, 0, .3);
    --shadow-drag: 0 10px 28px rgba(0, 0, 0, .6);
    --drop: rgba(91, 140, 255, .14);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    min-height: 100vh;
    transition: background .2s, color .2s;
  }
  button, input, textarea, select { font: inherit; color: inherit; }

  /* ---------- Шапка ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  }
  .brand { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
  .brand h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  .brand small { color: var(--muted); font-size: 12.5px; }
  .search {
    flex: 1 1 260px; max-width: 420px; position: relative;
  }
  .search input {
    width: 100%; padding: 10px 36px 10px 38px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface-2); outline: none;
  }
  .search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--drop); }
  .search .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search .clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    width: 28px; height: 28px; border-radius: 50%; font-size: 16px; display: none;
  }
  .search .clear.show { display: block; }
  .search .clear:hover { background: var(--border); }

  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: background .15s, border-color .15s, transform .05s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); background: var(--primary); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  .btn.danger:hover { filter: brightness(1.08); background: var(--danger); }
  .btn:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* ---------- Доска ---------- */
  .board {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px; padding: 16px; align-items: stretch;
    min-height: calc(100vh - 80px);
  }
  .column {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-top: 4px solid var(--accent, var(--primary));
    border-radius: 14px;
    display: flex; flex-direction: column; min-width: 0;
    transition: background .15s, box-shadow .15s;
  }
  .column.over { background: var(--drop); box-shadow: 0 0 0 2px var(--accent, var(--primary)) inset; }
  .col-head { padding: 12px 14px 8px; }
  .col-title { display: flex; align-items: center; gap: 8px; }
  .col-title h2 { margin: 0; font-size: 16px; flex: 1; }
  .col-badge {
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; font-size: 12px; padding: 1px 9px; font-weight: 600;
  }
  .col-add {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; color: var(--muted);
  }
  .col-add:hover { color: var(--primary); border-color: var(--primary); }
  .col-sum { font-size: 20px; font-weight: 700; margin-top: 6px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .col-meta { font-size: 12.5px; color: var(--muted); min-height: 18px; }

  .list { flex: 1; padding: 6px 10px 12px; display: flex; flex-direction: column; gap: 10px; min-height: 90px; }
  .empty { color: var(--muted); text-align: center; font-size: 13.5px; padding: 22px 8px; border: 1.5px dashed var(--border); border-radius: 10px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; box-shadow: var(--shadow); cursor: grab;
    display: flex; flex-direction: column; gap: 6px;
    transition: box-shadow .15s, transform .15s, border-color .15s;
    -webkit-user-select: none; user-select: none;
  }
  .card:hover { border-color: var(--primary); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .45; box-shadow: var(--shadow-drag); }
  .card.flash { animation: flash 1s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--primary); } 100% { box-shadow: var(--shadow); } }
  .card .name { font-weight: 650; word-break: break-word; }
  .card .amount { font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .card .comment { color: var(--muted); font-size: 13.5px; word-break: break-word; white-space: pre-wrap; }
  .card .foot { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
  .card .date { color: var(--muted); font-size: 12px; margin-right: auto; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; cursor: pointer; color: var(--muted); font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .icon-btn.del:hover:not(:disabled) { color: var(--danger); }
  .icon-btn:disabled { opacity: .25; cursor: default; }

  .placeholder {
    height: 56px; border-radius: 12px; border: 2px dashed var(--accent, var(--primary));
    background: var(--drop); flex-shrink: 0;
  }

  /* ---------- Диалоги ---------- */
  dialog {
    border: 1px solid var(--border); border-radius: 16px; padding: 0;
    background: var(--surface); color: var(--text);
    width: min(460px, calc(100vw - 24px)); box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
  }
  dialog::backdrop { background: rgba(8, 12, 24, .55); backdrop-filter: blur(2px); }
  .dlg { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .dlg h3 { margin: 0; font-size: 18px; }
  .dlg p { margin: 0; color: var(--muted); word-break: break-word; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 10px 12px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); outline: none;
  }
  .field textarea { resize: vertical; min-height: 84px; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--drop); }
  .amount-wrap { position: relative; }
  .amount-wrap input { padding-right: 34px; }
  .amount-wrap span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }

  /* ---------- Адаптив ---------- */
  @media (max-width: 1000px) {
    .board {
      display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch; padding-bottom: 24px;
    }
    .column { flex: 0 0 min(320px, 84vw); scroll-snap-align: start; }
  }
  @media (max-width: 600px) {
    header { padding: 10px 12px; gap: 8px; }
    .brand { flex: 1 1 100%; flex-direction: row; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .search { order: 3; flex: 1 1 100%; max-width: none; }
    .btn .txt-long { display: none; }
    .board { padding: 12px; gap: 10px; }
    .actions { flex-direction: column-reverse; }
    .actions .btn { width: 100%; justify-content: center; padding: 12px; }
    .icon-btn { width: 38px; height: 38px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Мини-CRM</h1>
    <small id="totalInfo">Сделки отдела продаж</small>
  </div>
  <div class="search">
    <span class="ico" aria-hidden="true">🔍</span>
    <input id="search" type="search" placeholder="Поиск по клиенту, сумме, комментарию…" autocomplete="off" aria-label="Поиск по карточкам">
    <button class="clear" id="searchClear" type="button" aria-label="Очистить поиск" title="Очистить">✕</button>
  </div>
  <button class="btn" id="themeBtn" type="button" aria-label="Переключить тему"></button>
  <button class="btn primary" id="addBtn" type="button">＋ <span>Новая<span class="txt-long"> сделка</span></span></button>
</header>

<main class="board" id="board" aria-label="Канбан-доска сделок"></main>

<!-- Диалог добавления / редактирования -->
<dialog id="dealDlg">
  <form class="dlg" id="dealForm" method="dialog" novalidate>
    <h3 id="dlgTitle">Новая сделка</h3>
    <div class="field">
      <label for="fName">Имя клиента *</label>
      <input id="fName" name="name" type="text" maxlength="120" required placeholder="Например, ООО «Ромашка»" autocomplete="off">
    </div>
    <div class="field">
      <label for="fAmount">Сумма сделки *</label>
      <div class="amount-wrap">
        <input id="fAmount" name="amount" type="number" inputmode="decimal" min="0" step="any" required placeholder="0">
        <span>₽</span>
      </div>
    </div>
    <div class="field">
      <label for="fStage">Этап</label>
      <select id="fStage" name="stage"></select>
    </div>
    <div class="field">
      <label for="fComment">Комментарий</label>
      <textarea id="fComment" name="comment" maxlength="1000" placeholder="Детали, договорённости, следующий шаг…"></textarea>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="cancelBtn">Отмена</button>
      <button class="btn primary" type="submit" id="saveBtn">Сохранить</button>
    </div>
  </form>
</dialog>

<!-- Диалог подтверждения удаления -->
<dialog id="delDlg">
  <div class="dlg">
    <h3>Удалить сделку?</h3>
    <p id="delText"></p>
    <div class="actions">
      <button class="btn" type="button" id="delCancel">Отмена</button>
      <button class="btn danger" type="button" id="delOk">Удалить</button>
    </div>
  </div>
</dialog>

<script>
(function () {
  'use strict';

  var STAGES = [
    { id: 'leads',   title: 'Лиды',        color: '#3b82f6' },
    { id: 'talks',   title: 'Переговоры',  color: '#f59e0b' },
    { id: 'payment', title: 'Оплата',      color: '#8b5cf6' },
    { id: 'closed',  title: 'Закрыто',     color: '#10b981' }
  ];
  var DATA_KEY = 'mini-crm-deals-v1';
  var THEME_KEY = 'mini-crm-theme';

  var fmt = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
  function money(n) { return fmt.format(n) + '\u00A0₽'; }
  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }
  function dealsWord(n) { return n + ' ' + plural(n, 'сделка', 'сделки', 'сделок'); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function fmtDate(ts) {
    var d = new Date(ts);
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  /* ---------- Хранилище ---------- */
  function demo() {
    var now = Date.now(), day = 86400000;
    return [
      { id: uid(), name: 'ООО «Ромашка»', amount: 150000, comment: 'Запросили коммерческое предложение на внедрение CRM.', status: 'leads', createdAt: now - 2 * day },
      { id: uid(), name: 'ИП Смирнов А. В.', amount: 48500, comment: 'Созвон назначен на пятницу в 15:00.', status: 'talks', createdAt: now - 5 * day },
      { id: uid(), name: 'АО «ТехноПарк»', amount: 320000, comment: 'Счёт выставлен, ждём оплату до конца недели.', status: 'payment', createdAt: now - 9 * day },
      { id: uid(), name: 'Студия «Орбита»', amount: 89900, comment: 'Договор подписан, оплата получена.', status: 'closed', createdAt: now - 14 * day }
    ];
  }
  function load() {
    try {
      var raw = localStorage.getItem(DATA_KEY);
      if (raw === null) return demo();
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return demo();
      var valid = STAGES.map(function (s) { return s.id; });
      return arr.filter(function (d) {
        return d && typeof d.id === 'string' && valid.indexOf(d.status) !== -1;
      }).map(function (d) {
        return {
          id: d.id, name: String(d.name || ''), amount: Number(d.amount) || 0,
          comment: String(d.comment || ''), status: d.status, createdAt: d.createdAt || Date.now()
        };
      });
    } catch (e) { return demo(); }
  }
  function save() {
    try { localStorage.setItem(DATA_KEY, JSON.stringify(deals)); } catch (e) { /* хранилище недоступно */ }
  }

  var deals = load();
  save();
  var query = '';
  var dragId = null;
  var flashId = null;

  /* ---------- Утилиты DOM ---------- */
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- Каркас доски ---------- */
  var board = $('board');
  var cols = {};
  var placeholder = el('div', 'placeholder');

  STAGES.forEach(function (st) {
    var col = el('section', 'column');
    col.style.setProperty('--accent', st.color);
    col.dataset.stage = st.id;

    var head = el('div', 'col-head');
    var title = el('div', 'col-title');
    var h2 = el('h2', null, st.title);
    var badge = el('span', 'col-badge', '0');
    var add = el('button', 'col-add', '+');
    add.type = 'button';
    add.title = 'Добавить сделку в «' + st.title + '»';
    add.setAttribute('aria-label', add.title);
    add.addEventListener('click', function () { openForm(null, st.id); });
    title.appendChild(h2); title.appendChild(badge); title.appendChild(add);
    var sum = el('div', 'col-sum', money(0));
    var meta = el('div', 'col-meta');
    head.appendChild(title); head.appendChild(sum); head.appendChild(meta);

    var list = el('div', 'list');
    col.appendChild(head); col.appendChild(list);
    board.appendChild(col);
    cols[st.id] = { col: col, list: list, sum: sum, badge: badge, meta: meta, stage: st };

    // Drag & drop: зона колонки
    col.addEventListener('dragover', function (e) {
      if (!dragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('over');
      var empty = list.querySelector('.empty');
      if (empty) empty.remove();
      placeholder.style.setProperty('--accent', st.color);
      var after = cardAfter(list, e.clientY);
      if (after) { if (placeholder.nextSibling !== after) list.insertBefore(placeholder, after); }
      else if (list.lastChild !== placeholder) list.appendChild(placeholder);
    });
    col.addEventListener('dragleave', function (e) {
      if (!col.contains(e.relatedTarget)) {
        col.classList.remove('over');
        if (placeholder.parentNode === list) { placeholder.remove(); render(); }
      }
    });
    col.addEventListener('drop', function (e) {
      if (!dragId) return;
      e.preventDefault();
      var beforeId = null;
      if (placeholder.parentNode === list) {
        var n = placeholder.nextSibling;
        while (n && !(n.classList && n.classList.contains('card'))) n = n.nextSibling;
        if (n) beforeId = n.dataset.id;
      }
      var id = dragId;
      endDrag();
      moveDeal(id, st.id, beforeId);
    });
  });

  function cardAfter(list, y) {
    var cards = Array.prototype.slice.call(list.querySelectorAll('.card:not(.dragging)'));
    var best = null, bestOffset = -Infinity;
    cards.forEach(function (c) {
      var r = c.getBoundingClientRect();
      var offset = y - r.top - r.height / 2;
      if (offset < 0 && offset > bestOffset) { bestOffset = offset; best = c; }
    });
    return best;
  }
  function endDrag() {
    dragId = null;
    if (placeholder.parentNode) placeholder.remove();
    Object.keys(cols).forEach(function (k) { cols[k].col.classList.remove('over'); });
  }

  /* ---------- Операции над данными ---------- */
  function moveDeal(id, stage, beforeId) {
    var idx = deals.findIndex(function (d) { return d.id === id; });
    if (idx === -1) return;
    var deal = deals.splice(idx, 1)[0];
    deal.status = stage;
    var pos = beforeId ? deals.findIndex(function (d) { return d.id === beforeId; }) : -1;
    if (pos === -1) deals.push(deal); else deals.splice(pos, 0, deal);
    flashId = id;
    save();
    render();
  }
  function stepDeal(id, dir) {
    var d = deals.find(function (x) { return x.id === id; });
    if (!d) return;
    var i = STAGES.findIndex(function (s) { return s.id === d.status; }) + dir;
    if (i < 0 || i >= STAGES.length) return;
    moveDeal(id, STAGES[i].id, null);
  }

  function matches(d) {
    if (!query) return true;
    var hay = (d.name + ' ' + d.comment + ' ' + d.amount + ' ' + fmt.format(d.amount) + ' ' +
      (STAGES.find(function (s) { return s.id === d.status; }) || {}).title).toLowerCase();
    return query.split(/\s+/).every(function (w) { return hay.indexOf(w) !== -1; });
  }

  /* ---------- Рендер ---------- */
  function buildCard(d) {
    var card = el('article', 'card');
    card.draggable = true;
    card.dataset.id = d.id;
    if (d.id === flashId) card.classList.add('flash');

    card.appendChild(el('div', 'name', d.name));
    card.appendChild(el('div', 'amount', money(d.amount)));
    if (d.comment) card.appendChild(el('div', 'comment', d.comment));

    var foot = el('div', 'foot');
    foot.appendChild(el('span', 'date', fmtDate(d.createdAt)));
    var si = STAGES.findIndex(function (s) { return s.id === d.status; });

    function btn(txt, label, cls, fn, disabled) {
      var b = el('button', 'icon-btn' + (cls ? ' ' + cls : ''), txt);
      b.type = 'button'; b.title = label; b.setAttribute('aria-label', label);
      b.disabled = !!disabled;
      b.addEventListener('click', function (e) { e.stopPropagation(); fn(); });
      // чтобы нажатие на кнопку не начинало перетаскивание
      b.addEventListener('dragstart', function (e) { e.preventDefault(); e.stopPropagation(); });
      return b;
    }
    foot.appendChild(btn('←', 'Переместить на предыдущий этап', '', function () { stepDeal(d.id, -1); }, si === 0));
    foot.appendChild(btn('→', 'Переместить на следующий этап', '', function () { stepDeal(d.id, 1); }, si === STAGES.length - 1));
    foot.appendChild(btn('✎', 'Редактировать', '', function () { openForm(d.id); }));
    foot.appendChild(btn('🗑', 'Удалить', 'del', function () { askDelete(d.id); }));
    card.appendChild(foot);

    card.addEventListener('dragstart', function (e) {
      dragId = d.id;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', d.id); } catch (err) {}
      setTimeout(function () { card.classList.add('dragging'); }, 0);
    });
    card.addEventListener('dragend', function () {
      var wasActive = dragId !== null;
      endDrag();
      if (wasActive) render(); // отмена перетаскивания — вернуть исходный вид
      else card.classList.remove('dragging');
    });
    card.addEventListener('dblclick', function () { openForm(d.id); });
    return card;
  }

  function render() {
    var totalAll = 0, shownAll = 0;
    STAGES.forEach(function (st) {
      var c = cols[st.id];
      var all = deals.filter(function (d) { return d.status === st.id; });
      var shown = all.filter(matches);
      var sumAll = all.reduce(function (s, d) { return s + d.amount; }, 0);
      var sumShown = shown.reduce(function (s, d) { return s + d.amount; }, 0);
      totalAll += sumAll; shownAll += all.length;

      c.sum.textContent = money(sumAll);
      c.badge.textContent = all.length;
      c.meta.textContent = query
        ? 'Найдено ' + shown.length + ' из ' + all.length + ' · ' + money(sumShown)
        : dealsWord(all.length);

      c.list.textContent = '';
      if (!shown.length) {
        c.list.appendChild(el('div', 'empty', query ? 'Ничего не найдено' : 'Нет сделок. Перетащите карточку сюда'));
      } else {
        shown.forEach(function (d) { c.list.appendChild(buildCard(d)); });
      }
    });
    $('totalInfo').textContent = 'Всего: ' + dealsWord(shownAll) + ' на ' + money(totalAll);
    flashId = null;
  }

  /* ---------- Форма добавления / редактирования ---------- */
  var dealDlg = $('dealDlg'), form = $('dealForm');
  var fName = $('fName'), fAmount = $('fAmount'), fComment = $('fComment'), fStage = $('fStage');
  var editingId = null;

  STAGES.forEach(function (s) {
    var o = document.createElement('option');
    o.value = s.id; o.textContent = s.title;
    fStage.appendChild(o);
  });

  function openForm(id, stage) {
    editingId = id;
    form.querySelectorAll('.invalid').forEach(function (n) { n.classList.remove('invalid'); });
    if (id) {
      var d = deals.find(function (x) { return x.id === id; });
      if (!d) return;
      $('dlgTitle').textContent = 'Редактирование сделки';
      $('saveBtn').textContent = 'Сохранить';
      fName.value = d.name; fAmount.value = d.amount; fComment.value = d.comment; fStage.value = d.status;
    } else {
      $('dlgTitle').textContent = 'Новая сделка';
      $('saveBtn').textContent = 'Добавить';
      fName.value = ''; fAmount.value = ''; fComment.value = ''; fStage.value = stage || STAGES[0].id;
    }
    dealDlg.showModal();
    setTimeout(function () { fName.focus(); }, 30);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = fName.value.trim();
    var amount = parseFloat(fAmount.value);
    if (!name) { fName.setCustomValidity('Укажите имя клиента'); fName.reportValidity(); fName.setCustomValidity(''); fName.focus(); return; }
    if (!isFinite(amount) || amount < 0) { fAmount.setCustomValidity('Введите сумму 0 или больше'); fAmount.reportValidity(); fAmount.setCustomValidity(''); fAmount.focus(); return; }
    var comment = fComment.value.trim();
    var stage = fStage.value;

    if (editingId) {
      var d = deals.find(function (x) { return x.id === editingId; });
      if (d) {
        var changedStage = d.status !== stage;
        d.name = name; d.amount = amount; d.comment = comment;
        if (changedStage) { dealDlg.close(); moveDeal(d.id, stage, null); return; }
        flashId = d.id;
      }
    } else {
      var nd = { id: uid(), name: name, amount: amount, comment: comment, status: stage, createdAt: Date.now() };
      deals.push(nd);
      flashId = nd.id;
    }
    save();
    dealDlg.close();
    render();
  });
  $('cancelBtn').addEventListener('click', function () { dealDlg.close(); });
  $('addBtn').addEventListener('click', function () { openForm(null); });

  // закрытие диалогов по клику на подложку
  [dealDlg, $('delDlg')].forEach(function (dlg) {
    dlg.addEventListener('mousedown', function (e) {
      if (e.target === dlg) dlg.close();
    });
  });

  /* ---------- Удаление ---------- */
  var delDlg = $('delDlg'), delId = null;
  function askDelete(id) {
    var d = deals.find(function (x) { return x.id === id; });
    if (!d) return;
    delId = id;
    $('delText').textContent = 'Сделка «' + d.name + '» на сумму ' + money(d.amount) + ' будет удалена без возможности восстановления.';
    delDlg.showModal();
  }
  $('delCancel').addEventListener('click', function () { delDlg.close(); });
  $('delOk').addEventListener('click', function () {
    deals = deals.filter(function (d) { return d.id !== delId; });
    delId = null;
    save();
    delDlg.close();
    render();
  });

  /* ---------- Поиск ---------- */
  var searchInput = $('search'), searchClear = $('searchClear');
  searchInput.addEventListener('input', function () {
    query = searchInput.value.trim().toLowerCase();
    searchClear.classList.toggle('show', !!searchInput.value);
    render();
  });
  searchClear.addEventListener('click', function () {
    searchInput.value = ''; query = '';
    searchClear.classList.remove('show');
    render(); searchInput.focus();
  });

  /* ---------- Тема ---------- */
  var themeBtn = $('themeBtn');
  function currentTheme() {
    var t = null;
    try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (t === 'dark' || t === 'light') return t;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️ Светлая' : '🌙 Тёмная';
    themeBtn.title = t === 'dark' ? 'Переключить на светлую тему' : 'Переключить на тёмную тему';
  }
  themeBtn.addEventListener('click', function () {
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(t);
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  });
  applyTheme(currentTheme());

  render();
})();
</script>
</body>
</html>
